<!DOCTYPE html>
<html>
<head>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
}

.header {
    background: #2563eb;
    color: white;
    padding: 20px;
    text-align: center;
}

.nav {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 15px;
    background: #e0e7ff;
}

.content {
    display: flex;
    gap: 20px;
    padding: 30px;
}

.card {
    flex: 1;
    padding: 25px;
    background: #f1f5f9;
    border-radius: 12px;
}

.highlight {
    color: #2563eb;
    font-weight: bold;
}

.footer {
    background: #1e293b;
    color: white;
    text-align: center;
    padding: 15px;
}
</style>
</head>

<body>

<div class="header">
    <h1>My College</h1>
    <p>Welcome to <span class="highlight">ITM University</span></p>
</div>

<div class="nav">
    <div>Home</div>
    <div>Courses</div>
    <div>About</div>
    <div>Contact</div>
</div>

<div class="content">

    <div class="card">
        <h2>Courses</h2>
        <p>B.Tech, BCA, MCA</p>
    </div>

    <div class="card">
        <h2>Students</h2>
        <p><span class="highlight">5000+</span> Students</p>
    </div>

    <div class="card">
        <h2>Programs</h2>
        <p>UG & PG Programs</p>
    </div>

</div>

<div class="footer">
    © 2026 My College
</div>

</body>
</html>
