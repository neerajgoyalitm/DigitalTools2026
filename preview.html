<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: flex;
    gap: 20px;
}
.card {
    width: 200px;
    padding: 20px;
    border-radius: 15px;
    background: #dff6ff;
    text-align: center;
}

.name {
    color: #0066cc;
    font-size: 22px;
    font-weight: bold;
}

.course {
    color: #ff6600;
}
</style>
</head>

<body>
<div class="container">

    <div class="card">
        <div class="name">Rahul</div>
        <p>Course: <span class="course">BCA</span></p>
    </div>

    <div class="card">
        <div class="name">Priya</div>
        <p>Course: <span class="course">B.Tech</span></p>
    </div>

    <div class="card">
        <div class="name">Aman</div>
        <p>Course: <span class="course">MCA</span></p>
    </div>

</div>

</body>
</html>
