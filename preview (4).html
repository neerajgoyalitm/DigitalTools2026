<!DOCTYPE html>
<html>
<head>
<style>
.dashboard {
    display: flex;
    gap: 20px;
}

.box {
    flex: 1;
    padding: 25px;
    text-align: center;
    border-radius: 15px;
}

.students {
    background: #d1ecf1;
}

.courses {
    background: #fff3cd;
}

.result {
    background: #d4edda;
}

.number {
    font-size: 30px;
    font-weight: bold;
}

.label {
    color: #555;
}
</style>
</head>

<body>

<h1>College Dashboard</h1>

<div class="dashboard">

    <div class="box students">
        <span class="number">500</span>
        <p class="label">Students</p>
    </div>

    <div class="box courses">
        <span class="number">25</span>
        <p class="label">Courses</p>
    </div>

    <div class="box result">
        <span class="number">92%</span>
        <p class="label">Result</p>
    </div>

</div>

</body>
</html>
