<!DOCTYPE html>
<html>
<head>
<style>
.products {
    display: flex;
    gap: 20px;
}

.product {
    width: 180px;
    padding: 20px;
    border-radius: 15px;
    background: #f3e5f5;
    text-align: center;
}

.price {
    color: #e91e63;
    font-size: 20px;
    font-weight: bold;
}

.offer {
    color: green;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="products">

    <div class="product">
        <h2>Laptop</h2>
        <p>Price: <span class="price">₹45,000</span></p>
        <span class="offer">20% OFF</span>
    </div>

    <div class="product">
        <h2>Mobile</h2>
        <p>Price: <span class="price">₹20,000</span></p>
        <span class="offer">15% OFF</span>
    </div>

    <div class="product">
        <h2>Headphones</h2>
        <p>Price: <span class="price">₹2,000</span></p>
        <span class="offer">10% OFF</span>
    </div>

</div>

</body>
</html>
